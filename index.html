<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2025 我们的独家记忆</title>
   <style>
        /* --- 1. 全局资源与字体 --- */
        @font-face {
            font-family: 'HongLeiZhuoShu';
            src: url('鸿雷拙书简体 HongLeiZhuoShuJianTi.ttf'); 
            font-weight: normal; font-style: normal;
        }

        :root {
            /* 莫兰迪色系调整 */
            --bg-color: #EBE9E4;       /* 米灰背景 */
            --text-main: #585c5f;      /* 深灰字 */
            --text-date: #8fa0a5;      /* 雾霾蓝 */
            --wechat-green: #95ec69;   /* 微信绿 */
            --suitcase-body: #7d6e64;  /* 行李箱深咖色 */
            --suitcase-light: #9c8b80; /* 行李箱浅色 */
            --card-bg: rgba(255, 255, 255, 0.85);
            --accent-red: #b67e75;     /* 重点砖红 */
            
            /* iPhone 安全区域变量 */
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg-color);
            font-family: "Songti SC", "Noto Serif SC", "Times New Roman", serif;
            height: 100vh;
            /* 禁止 iOS 回弹露出背景 */
            overscroll-behavior: none;
            display: flex; flex-direction: column; overflow: hidden; color: var(--text-main); position: relative;
        }
       .gentle-next{
    position:absolute;
    bottom:calc(70px + var(--safe-bottom));
    left:50%;
    transform:translateX(-50%);
    padding:6px 24px;
    background:rgba(235,233,228,.45);
    border:0.5px solid rgba(88,92,95,.25);
    border-radius:20px;
    font-size:14px;
    color:var(--text-main);
    letter-spacing:1px;
    cursor:pointer;
    opacity:0;                 /* 关键：彻底透明 */
    pointer-events:none;
    transition:opacity .6s, background .4s;
}
.gentle-next.show{
    opacity:0.7;               /* 需要显示时才给到 0.7 */
    pointer-events:all;
}
.gentle-next:active{
    background:rgba(235,233,228,.85);
    opacity:1;
}
        /* ========================================= */
        /* === 页面切换基础架构 === */
        /* ========================================= */
        .page {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--bg-color);
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.8s ease;
            z-index: 1; opacity: 0; pointer-events: none;
            
            /* 适配刘海屏 */
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        .page.active, #page-2.active { opacity: 1; transform: translateY(0); z-index: 10; pointer-events: all; }
        .page.leave { transform: translateY(-100%); opacity: 0.5; }

        /* ========================================= */
        /* === 第一页样式：聊天与标题 === */
        /* ========================================= */
        #page-1 { z-index: 2; display: flex; flex-direction: column; }
        
        #header-area {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-end;
            text-align: right; padding: 20px 25px; z-index: 10;
        }
        .header-row { opacity: 0; transition: opacity 1.5s ease; } .header-row.active { opacity: 1; }
        .header-row-1 { opacity: 0; margin-bottom: 15px; display: flex; align-items: center; justify-content: flex-end; transition: opacity 0.8s ease; } .header-row-1.active { opacity: 1; }
        .char-span { opacity: 0; display: inline-block; transition: opacity 0.1s; } .char-span.show { opacity: 1; }
        .header-time { font-family: "Times New Roman", serif; font-size: 36px; letter-spacing: 1px; }
        .header-icon { font-size: 24px; margin-right: 10px; opacity: 0.8; }
        .header-sep { width: 160px; height: 0.5px; background: rgba(88,92,95,0.3); margin-bottom: 15px; }
        .header-quote { font-family: "HongLeiZhuoShu", "鸿雷拙书", cursive; font-size: 30px; margin-bottom: 10px; letter-spacing: 2px; }
        .header-loc { font-size: 20px; color: #a0a0a0; 
            /* font-family: "HongLeiZhuoShu";  */
            letter-spacing: 1px; }
        #row-3{margin-bottom: 15px;}
        
        /* 聊天区适配 */
        #chat-container {
            height: 60vh; overflow-y: auto; 
            padding: 20px 15px calc(60px + var(--safe-bottom)) 15px;
            scrollbar-width: none;
            mask-image: linear-gradient(to bottom, transparent, black 10%);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%);
        }
        .message-row { display: flex; margin-bottom: 15px; opacity: 0; transform: translateY(20px); transition: all 0.5s ease; } .message-row.show { opacity: 1; transform: translateY(0); }
        .avatar { width: 42px; height: 42px; border-radius: 6px; background-size: cover; margin: 0 10px; flex-shrink: 0; }
        .bubble { max-width: 75%; padding: 10px 14px; border-radius: 6px; font-size: 16px; line-height: 1.5; position: relative; }
        .message-row.left .avatar { background-image: url('wxy微信头像.jpg'); margin-left: 0;} .message-row.left .bubble { background: #fff; } .message-row.left .bubble::before { content:''; position:absolute; left:-8px; top:14px; border:4px solid transparent; border-right-color:#fff; }
        .message-row.right { justify-content: flex-end; } .message-row.right .avatar { background-image: url('我的微信头像.jpg'); margin-right: 0; order: 2;} .message-row.right .bubble { background: var(--wechat-green); order: 1;} .message-row.right .bubble::after { content:''; position:absolute; right:-8px; top:14px; border:4px solid transparent; border-left-color:var(--wechat-green); }

        /* 底部栏适配 */
        .footer-bar { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            height: calc(60px + var(--safe-bottom)); 
            padding-bottom: var(--safe-bottom);
            background: rgba(235, 233, 228, 0.9); backdrop-filter: blur(10px); 
            display: flex; align-items: center; padding-left: 15px; padding-right: 15px; 
            z-index: 100; border-top: 1px solid rgba(0,0,0,0.05); 
        }
        .input-mock { flex: 1; height: 38px; background: #fff; border-radius: 6px; margin: 0 10px; } .icon { width: 26px; opacity: 0.6; }

        /* 语音弹窗适配 */
        #call-banner { 
            position: fixed; top: calc(10px + var(--safe-top)); left: 10px; right: 10px; height: 80px; 
            background: rgba(35,35,35,0.95); backdrop-filter: blur(20px); border-radius: 16px; 
            display: flex; align-items: center; padding: 0 15px; color: white; 
            transform: translateY(-200%); transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 999; 
        }
        #call-banner.active { transform: translateY(0); }
        .banner-avatar { width: 48px; height: 48px; border-radius: 8px; background-image: url('wxy微信头像.jpg'); background-size: cover; margin-right: 12px; } .banner-info { flex: 1; } .banner-name { font-weight: 600; } .banner-status { font-size: 13px; opacity: 0.7; } .banner-actions { display: flex; gap: 5px; } .action-circle { width: 42px; height: 42px; border-radius: 50%; display: flex; justify-content: center; align-items: center;margin-right: 25px;  } .bg-red { background: #ff3b30; } .bg-green { background: #34c759; } .phone-icon { width: 20px; height: 3px; background: white; border-radius: 2px; }

        /* Toast 适配 */
        #top-toast { 
            position: fixed; top: calc(100px + var(--safe-top)); right: 20px; 
            background: rgba(255,255,255,0.95); padding: 8px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transform: translateY(10px); transition: 0.4s; pointer-events: none; z-index: 1000; 
        }
        #top-toast.show { opacity: 1; transform: translateY(0); }


        /* ========================================= */
        /* === 第二页：足迹行李箱 (iPhone 16P 适配) === */
        /* ========================================= */
        #page-2 {
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            background-color: #F8F5DD;
            padding-top: calc(20px + var(--safe-top));
        }

        /* --- 卡片区域适配 --- */
        .stats-container {
            position: absolute;
            /* 避开灵动岛，使用 vh 适配长屏幕 */
            top: calc(8vh + var(--safe-top));
            width: 100%; padding: 0 30px;
            display: flex; flex-direction: column; gap: 20px; z-index: 20;
        }

        .stat-card {
            background-color: #E4C391; 
            backdrop-filter: blur(10px); border-radius: 12px; padding: 15px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex; align-items: center; justify-content: space-between;
            opacity: 0; transform: translateY(-20px); transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .stat-card.show { opacity: 1; transform: translateY(0); }

        .card-icon { font-size: 24px; margin-right: 15px; width: 30px; text-align: center; }
        .card-info { flex: 1; }
        .card-label { font-size: 18px; color: #121111; font-weight: 500; margin-bottom: 4px; }
        .card-value { font-size: 22px; font-weight: bold; color: #0b0b0b; font-family: "HongLeiZhuoShu", serif; letter-spacing: 1px; line-height: 1.2; }
        .card-highlight { color: #7e1c0d; }

        /* --- 吐槽文字适配 --- */
        .cheeky-comment {
            position: absolute;
            /* 在长屏幕上自动下移，避免和卡片重叠 */
            top: 10vh; 
            right: auto; left: 10%;
            text-align: left;
            font-family: "HongLeiZhuoShu", serif; color: #A5B8E0; font-size: 38px; line-height: 1.5; white-space: nowrap;
            opacity: 0; transform-origin: bottom left; transform: rotate(-2deg) scale(0.9); transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        .cheeky-comment.show { opacity: 1; transform: rotate(-2deg) scale(1); }

        /* --- 行李箱适配 --- */
        .suitcase-wrapper {
            position: relative;
            /* 宽度改用 vw 适配 iPhone 16P 宽屏 */
            width: 85vw; max-width: 360px;
            height: 100vw; max-height: 420px;
            /* 避开底部横条 */
            margin-bottom: calc(-30px + var(--safe-bottom));
            transform: translateY(100%); transition: transform 1s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .suitcase-wrapper.show { transform: translateY(0); }

        /* 行李箱内部保持百分比布局 */
        .handle-bar { width: 46%; height: 26%; border: 8px solid #5a4a42; border-bottom: none; border-radius: 10px 10px 0 0; position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 1; }
        .suitcase-body { position: absolute; bottom: 12%; left: 0; width: 100%; height: 68%; background-color: var(--suitcase-body); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 5; overflow: hidden; border: 2px solid #5a4a42; }
        .suitcase-stripe { position: absolute; top: 0; bottom: 0; width: 6%; background-color: rgba(0,0,0,0.1); }
        .stripe-left { left: 15%; } .stripe-right { right: 15%; }
        .hand-grip { position: absolute; top: -4%; left: 50%; transform: translateX(-50%); width: 26%; height: 8%; background: #3e332d; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 10; }
        .corner { position: absolute; width: 12%; height: 12%; background: #5a4a42; opacity: 0.8; }
        .c-tl { top: 0; left: 0; border-bottom-right-radius: 100%; } .c-tr { top: 0; right: 0; border-bottom-left-radius: 100%; } .c-bl { bottom: 0; left: 0; border-top-right-radius: 100%; } .c-br { bottom: 0; right: 0; border-top-left-radius: 100%; }

        /* --- 贴纸样式 (合并整理) --- */
        .sticker {
            position: absolute; background: rgba(255, 255, 255, 0); 
            /* 制造邮票花边 */
            /* padding: 2px; border: 5px dotted #e0e0e0; border-radius: 2px;  */
            /* box-shadow: 2px 3px 5px rgba(0,0,0,0.15); */
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; transform: scale(2); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .sticker.show { opacity: 1; }
        
        .sticker img {
            width: 100%; height: 100%; object-fit: cover; 
            border-radius: 2px; margin: 0; display: block;
        }

        /* --- 8个贴纸的定制布局 (位置改用 %) --- */
        
        /* 1. 函馆 (左上偏中) */
        .sticker-1 { top: 10%; left: 10%; transform: rotate(-15deg) scale(0); z-index: 12; width: 100px; height: 100px; background: transparent; border: 0; }
        .sticker-1.show { transform: rotate(-15deg) scale(1); }
        .sticker-1 img { width: 120%; height: 120%; } /* 特殊图片放大 */

        /* 2. 札幌 (右上) */
        .sticker-2 { top: 15%; right: -20%; transform: rotate(12deg) scale(0); z-index: 1; background: transparent; border: 0; }
        .sticker-2.show { transform: rotate(12deg) scale(1); }
        .sticker-2 img { width: 30%; height: 30%; }

        /* 3. 小樽（左下） */
        .sticker-3 { bottom: 5%; left: -40%; margin-left: -80px; transform: rotate(-3deg) scale(0); background: #b67e7500; color: white; border-color: #b67e7500; z-index: 10;  }
        .sticker-3 img { width: 20%; height: 20%; }
        .sticker-3.show { transform: rotate(-3deg) scale(1); }

        /* 4. 东京 (左中) */
        .sticker-4 { top: 60%; RIGHT:-60%; transform: rotate(5deg) scale(0); z-index: 3; background: transparent; border: 0; }
        .sticker-4.show { transform: rotate(5deg) scale(1); }
        .sticker-4 img { width: 15%; height: 15%; }
        
        /* 5. 广州 (正中间) */
        .sticker-5 { top: 50%; left: 10%; transform: rotate(-8deg) scale(0); z-index: 4; background: transparent;}
        .sticker-5.show { transform: rotate(-8deg) scale(1); }
        .sticker-5 img { width: 30%; height: 30%; }
        /* 6. 深圳 (右下) */
        .sticker-6 { bottom: 30%;left:-50%; transform: rotate(15deg) scale(0); z-index: 10;  background: transparent; }
        .sticker-6.show { transform: rotate(15deg) scale(1); }
        .sticker-6 img { width: 10%; height: 10%; }
        /* 7. 香港 (右上偏下) */
        .sticker-7 { top: 35%; right: -60%; transform: rotate(-10deg) scale(0); z-index: 3; }
        .sticker-7.show { transform: rotate(-7deg) scale(1); }
        .sticker-7 img { width: 15%; height: 15%;} 
        /* 8.北京 */
        .sticker-8 { top: 5%; RIGHT: 10%; transform: rotate(2deg) scale(0); z-index: 1; width: 70px; height: 70px; }
        .sticker-8.show { transform: rotate(2deg) scale(1); }

        /* ========================================= */
        /* === 第三页：深夜弹幕 (本次新增) === */
        /* ========================================= */

      #page-3 { overflow: hidden; position: relative; }

        /* 1. 弹幕层 (底层) */
        #danmu-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: all;
        }
        .danmu-item {
            position: absolute; white-space: nowrap; font-size: 14px;
            color: rgba(60, 60, 60, 0.6); /* 稍微淡一点，别抢九宫格戏 */
            font-family: "Songti SC", serif; cursor: pointer;
            left: 100%; transition: color 0.3s;
        }
        .danmu-item.paused { 
            animation-play-state: paused !important; z-index: 100; 
            color: var(--accent-red); opacity: 1; font-weight: bold; 
        }
        @keyframes floatLeft { from { transform: translateX(0); } to { transform: translateX(-150vw); } }

        /* 2. 核心内容容器 (上层) */
        .identity-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; pointer-events: none; /* 让空白处不挡弹幕 */
            
        }

        /* 标题区域 */
        .page3-header {
            text-align: center; margin-bottom: 30px; 
            opacity: 0; transform: translateY(20px); transition: all 0.8s ease;
            pointer-events: auto;
        }
        .p3-title { font-size: 16px; color: #555; margin-bottom: 8px; letter-spacing: 1px; }
        .p3-main-text { 
            font-family: "HongLeiZhuoShu", serif; font-size: 26px; color: var(--text-main); 
            line-height: 1.4; padding: 0 20px;
        }
        .p3-main-text span { color: var(--accent-red); font-size: 32px; margin: 0 5px; }
        .p3-sub-text { 
            font-size: 12px; color: #888; margin-top: 20px; 
            background: rgba(255,255,255,0.6); padding: 5px 15px; border-radius: 20px;
            display: inline-block;
        }

        /* 3. 九宫格区域 */
        .grid-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 85vw; max-width: 360px;
            pointer-events: auto;
        }

        .id-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            aspect-ratio: 1; /* 正方形 */
            border-radius: 12px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0; transform: scale(0.5); /* 初始隐藏 */
            border: 1px solid rgba(0,0,0,0.05);
        }
        .id-card.show { opacity: 1; transform: scale(1); }
        .id-card:active { transform: scale(0.95); background: #f0f0f0; }

        .id-icon { font-size: 24px; margin-bottom: 5px; }
        .id-name { font-size: 13px; color: #333; font-weight: 500; text-align: center;}

        /* --- 弹窗样式 (Chat Modal) --- */
        #chat-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 999;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        #chat-modal.active { opacity: 1; pointer-events: all; }

        .modal-content {
            width: 85vw; max-width: 340px;
            background: #F5F5F5;
            border-radius: 12px;
            overflow: hidden;
            transform: scale(0.9); transition: transform 0.3s;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        #chat-modal.active .modal-content { transform: scale(1); }

        /* 模拟微信窗口 */
        .wx-header {
            background: #EDEDED; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #dcdcdc; font-size: 15px; font-weight: 600; color: #000;
        }
        .wx-close { font-size: 20px; color: #333; cursor: pointer; padding: 0 5px; }
        
        .wx-body {
            padding: 20px 15px;
            max-height: 50vh; overflow-y: auto;
        }
        
        /* 弹窗里的气泡样式 */
        .wx-msg { display: flex; margin-bottom: 15px; }
        .wx-msg.right { justify-content: flex-end; }
        .wx-avatar { width: 36px; height: 36px; border-radius: 4px; background-color: #ddd; flex-shrink: 0; background-size: cover; }
        .wx-msg.left .wx-avatar { margin-right: 10px; background-image: url('wxy微信头像2.jpg'); }
        .wx-msg.right .wx-avatar { margin-left: 10px; order: 2; background-image: url('我的微信头像2.jpg'); }
        .wx-bubble { 
            max-width: 70%; padding: 9px 12px; border-radius: 4px; font-size: 15px; line-height: 1.4; position: relative; color: #000;
        }
        .wx-msg.left .wx-bubble { background: #fff; border: 1px solid #ededed; }
        .wx-msg.right .wx-bubble { background: #95ec69; order: 1; border: 1px solid #8ad961; }
        
        /* 气泡小三角 */
        .wx-msg.left .wx-bubble::before { content:''; position:absolute; left:-6px; top:12px; border:3px solid transparent; border-right-color:#fff; }
        .wx-msg.right .wx-bubble::after { content:''; position:absolute; right:-6px; top:12px; border:3px solid transparent; border-left-color:#95ec69; }

        .time-tip { text-align: center; font-size: 12px; color: #ccc; margin-bottom: 15px; }
    
        /* ========================================= */
        /* === 第四页样式：视频与浮动文字 === */
        /* ========================================= */
       /* ========================================= */
        /* === 第四页样式：莫兰迪色系与富士山展排版 === */
        /* ========================================= */
        /* ========================================= */
        /* === 第四页样式：暖调莫兰迪 & 漂浮动效 === */
        /* ========================================= */
        .p4-layout-ref {
            display: flex; flex-direction: column;
            background-color: #F5F1E8; /* 杏仁奶油背景 */
            padding-top: calc(50px + var(--safe-top));
            align-items: center;
            color: #4A4A4A;
        }

        /* --- 视频区域 --- */
        .p4-video-container {
            width: 88%; max-width: 360px;
            aspect-ratio: 4/3; /* 稍微方一点，复古比例 */
            margin-bottom: 20px; z-index: 10;
            opacity: 0; transform: scale(0.95); transition: 1s ease;
        }
        .p4-video-container.show { opacity: 1; transform: scale(1); }

        .video-box {
            width: 100%; height: 100%;
            border-radius: 6px; overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); /* 柔和阴影 */
            background: #000;
        }
        .video-box video { width: 100%; height: 100%; object-fit: cover; }

        /* --- 下方布局容器 (左右分栏) --- */
        .p4-content-area {
            width: 100%; padding: 0 30px;
            display: flex; justify-content: space-between;
            flex: 1; position: relative;
        }

        /* --- 左侧漂浮区 --- */
        .p4-float-zone {
            width: 30%; position: relative; height: 200px;
        }
        .floater {

        // --- 打字机工具 ---
       // --- 增强版打字机：支持换行 ---
        async function playTypewriter(elementId, speed = 100) {
            const el = document.getElementById(elementId);
            // 1. 获取文本，innerText 会把 <br> 转换为换行符 \n
            const text = el.innerText; 
            el.innerHTML = ''; // 清空内容
            
            // 2. 逐字处理
            for(let char of text) {
                // 如果检测到换行符，插入 <br> 标签
                if (char === '\n') {
                    el.appendChild(document.createElement('br'));
                } else {
                    // 普通字符包裹在 span 中
                    const span = document.createElement('span');
                    span.innerText = char;
                    span.className = 'char-span';
                    el.appendChild(span);
                    
                    // 稍微延迟一点点加 show 类，确保动画生效
                    setTimeout(() => span.classList.add('show'), 10);

        // --- 弹窗逻辑 ---

            const data = identities[index];

                    html = `<div class="time-tip">${msg.text}</div>`;
                } else {
                    html = `
                        <div class="wx-msg ${msg.type}">

                            <div class="wx-bubble">${msg.text}</div>
                        </div>
                    `;

        function initDanmu() {
            const container = document.getElementById('danmu-layer');

            nightMessages.forEach((text, index) => {
                const el = document.createElement('div');
                el.classList.add('danmu-item');
                el.innerText = text;
                
                // --- 随机参数配置 ---
                
                // 1. 垂直位置 (Top): 5% 到 90% 之间随机
                let topPos = Math.random() * 90;
                el.style.top = topPos + '%';

                // 2. 动画时长 (Speed): 15秒 到 30秒 之间随机
                const duration = 15 + Math.random() * 15; 
                el.style.animationName = 'floatLeft';
                el.style.animationDuration = duration + 's';
                el.style.animationTimingFunction = 'linear';
                el.style.animationIterationCount = 'infinite';

                // 3. 动画延迟 (Delay): 负数延迟可以让动画一开始就铺满屏幕
                const delay = -1 * Math.random() * 20;
                el.style.animationDelay = delay + 's';

                // 4. 字体大小微调
                const fontSize = 12 + Math.random() * 6;
                el.style.fontSize = fontSize + 'px';
                
                // 5. 透明度微调
                el.style.opacity = 0.2 + Math.random() * 0.4;

                // --- 点击交互事件 ---
                el.onclick = function(e) {
                    e.stopPropagation(); // 阻止冒泡
                    this.classList.toggle('paused'); // 切换暂停
                };

                container.appendChild(el);
            });
        }

/* ========== 渲染第五页 ========== */
function renderCalendar() {
  const grid = document.getElementById('p5-grid');
  const monthCount = meetRecord.filter(days => days.includes(1)).length;
  document.getElementById('month-count').textContent = monthCount;

  meetRecord.forEach((days, mIndex) => {
    const card = document.createElement('div');
    card.className = 'month-card';
    card.innerHTML = `
      <div class="month-name">${mIndex + 1}月</div>
      <div class="days"></div>
    `;
    const daysBox = card.querySelector('.days');
   days.forEach((d, dIndex) => {
  const dot = document.createElement('div');
  dot.className = 'day' + (d === 1 ? ' met' : '');   // 这里必须是 1 才加 met
  daysBox.appendChild(dot);
});
    grid.appendChild(card);
    // stagger 出现
    setTimeout(() => card.classList.add('show'), mIndex * 120);
  });
}
